<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My eCommerce Store</title>
    <link rel="stylesheet" href="style.css">
    <!--
        Firebase SDKs will now be imported as ES modules in the JavaScript files.
        Ensure your development environment supports ES modules (modern browsers do)
        or use a bundler like Webpack, Parcel, or Vite for production.
    -->
</head>
<body>
    <header>
        <h1>Awesome Products</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="admin.html">Admin</a>
            <button id="cart-button-header" class="button button-light">
                Cart <span id="cart-count" style="display: none;">0</span>
            </button>
            <button id="login-button-header" class="button button-primary">Login</button>
            <span id="user-status">Logged out</span>
        </nav>
    </header>

    <main>
        <h2>Products</h2>
        <div id="message-area-home" class="message-area"></div>
        <div id="product-list">
            <!-- Products will be loaded here by JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2023 My eCommerce Store</p>
    </footer>

    <!--
        JavaScript files are now treated as ES modules.
        The new firebase.js will handle initialization and export necessary instances.
        Other scripts will import from firebase.js and Firebase SDK modules.
    -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="app.js"></script>

    <!-- Cart Modal Structure -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <button class="close-button">&times;</button>
            </div>
            <div id="cart-items-list">
                <!-- Cart items will be rendered here by cart.js -->
            </div>
            <div class="empty-cart-message" style="display: none;">
                <p>Your cart is currently empty.</p>
            </div>
            <div id="cart-total">Total: $0.00</div>
            <button id="cart-checkout-button" class="button button-success">Proceed to Checkout</button>
        </div>
    </div>
</body>
</html>
